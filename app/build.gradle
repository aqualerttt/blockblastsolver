plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blockblast.solver'
    compileSdk 34

    defaultConfig {
        applicationId "com.blockblast.solver"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // FIX: Defining signingConfigs BEFORE buildTypes uses it
    signingConfigs {
        release {
            // Inherits the default Android debug key so the GitHub Action can build it without private keys
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                    }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // FIX: Moved packagingOptions inside the android block where it belongs
    packagingOptions {
        exclude 'META-INF/kotlin-stdlib-jdk8.kotlin_module'
        exclude 'META-INF/kotlin-stdlib-jdk7.kotlin_module'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    }
}
